<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" fill="none" role="img" aria-label="VIVEMO – Viver Verde Moçambique">

  <!-- ===== ÍCONE: mãos segurando planta ===== -->

  <!-- Mão esquerda -->
  <path fill="#2ecc52" d="
    M138 175
    C125 168 112 155 108 138
    C104 120 112 105 124 106
    C128 106 132 109 134 114
    C130 118 127 126 129 137
    C131 148 138 158 147 165
    Z
  "/>
  <!-- Dedos mão esquerda -->
  <path fill="#2ecc52" d="
    M108 138
    C104 122 110 106 122 103
    C132 100 140 108 137 120
    C132 114 124 115 120 122
    Z
  "/>
  <!-- Palma esquerda base -->
  <path fill="#2ecc52" d="
    M147 165
    C155 172 166 176 175 172
    C170 163 161 154 152 148
    C146 143 140 144 137 149
    Z
  "/>

  <!-- Mão direita (espelho) -->
  <path fill="#2ecc52" d="
    M262 175
    C275 168 288 155 292 138
    C296 120 288 105 276 106
    C272 106 268 109 266 114
    C270 118 273 126 271 137
    C269 148 262 158 253 165
    Z
  "/>
  <!-- Dedos mão direita -->
  <path fill="#2ecc52" d="
    M292 138
    C296 122 290 106 278 103
    C268 100 260 108 263 120
    C268 114 276 115 280 122
    Z
  "/>
  <!-- Palma direita base -->
  <path fill="#2ecc52" d="
    M253 165
    C245 172 234 176 225 172
    C230 163 239 154 248 148
    C254 143 260 144 263 149
    Z
  "/>

  <!-- ===== PLANTA ===== -->

  <!-- Caule -->
  <rect fill="#2ecc52" x="197" y="90" width="6" height="82" rx="3"/>

  <!-- Folha central (topo) -->
  <path fill="#2ecc52" d="
    M200 90
    C192 72 178 52 188 34
    C194 22 206 26 210 40
    C215 56 207 74 200 90
    Z
  "/>
  <!-- Nervura folha central -->
  <path fill="#27ae60" d="M200 90 C200 72 202 52 201 36 C203 52 203 72 200 90 Z"/>

  <!-- Folha esquerda -->
  <path fill="#2ecc52" d="
    M195 112
    C178 98 158 90 154 74
    C150 61 160 52 170 59
    C181 67 190 88 195 112
    Z
  "/>
  <!-- Nervura folha esquerda -->
  <path fill="#27ae60" d="M195 112 C186 96 172 78 162 63 C170 72 183 92 195 112 Z"/>

  <!-- Folha direita -->
  <path fill="#2ecc52" d="
    M205 112
    C222 98 242 90 246 74
    C250 61 240 52 230 59
    C219 67 210 88 205 112
    Z
  "/>
  <!-- Nervura folha direita -->
  <path fill="#27ae60" d="M205 112 C214 96 228 78 238 63 C230 72 217 92 205 112 Z"/>

  <!-- ===== TEXTO ===== -->

  <!-- "VIVER" — verde escuro sólido -->
  <text
    x="52"
    y="210"
    font-family="'Montserrat','Arial Black',sans-serif"
    font-weight="900"
    font-size="36"
    fill="#1a5c2a"
    letter-spacing="5"
  >VIVER</text>

  <!-- "VERDE" — outline verde brilhante -->
  <text
    x="207"
    y="210"
    font-family="'Montserrat','Arial Black',sans-serif"
    font-weight="900"
    font-size="36"
    fill="none"
    stroke="#2ecc52"
    stroke-width="1.5"
    letter-spacing="5"
  >VERDE</text>

  <!-- "MOÇAMBIQUE" — outline verde brilhante -->
  <text
    x="30"
    y="238"
    font-family="'Montserrat','Arial Black',sans-serif"
    font-weight="900"
    font-size="30"
    fill="none"
    stroke="#2ecc52"
    stroke-width="1.5"
    letter-spacing="4"
  >MOÇAMBIQUE</text>

  <!-- "VIVEMO" — pequeno, verde brilhante sólido, centrado -->
  <text
    x="200"
    y="256"
    font-family="'Montserrat','Arial',sans-serif"
    font-weight="700"
    font-size="13"
    fill="#2ecc52"
    letter-spacing="7"
    text-anchor="middle"
  >VIVEMO</text>

</svg>
